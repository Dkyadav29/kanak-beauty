<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- kanak-maintenance: scripts/site.ps1 looks for this marker to report the site as OFF. -->
<title>Kanak Beauty Service – Under maintenance</title>
<style>
  :root { --bg: #fbf8f5; --card: #ffffff; --text: #2a2422; --muted: #6b605b; --accent: #a1304f; --border: #ece3db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151212; --card: #1d1918; --text: #efe7e2; --muted: #b0a49e; --accent: #e5809d; --border: #3a3331; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .card { max-width: 520px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 44px 32px; box-shadow: 0 16px 40px -16px rgba(161, 48, 79, 0.25); }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 28px; color: var(--accent); margin: 0; }
  .tag { margin: 6px 0 28px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: normal; font-size: 24px; margin: 0 0 12px; }
  p { color: var(--muted); line-height: 1.6; margin: 0; }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">Kanak Beauty Service</p>
    <p class="tag">Professional Beauty Training</p>
    <h1>We'll be back soon</h1>
    <p>Our website is temporarily unavailable for maintenance. Please check back later.</p>
  </main>
</body>
</html>
